name: Build Images Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install pyyaml --break-system-packages

      - name: Download ZeroPoint Agent v2.0.0
        run: |
          AGENT_VERSION=2.0.0
          AGENT_WHEEL="zeropoint_agent-${AGENT_VERSION}-py3-none-any.whl"
          AGENT_SHA256=2f9187d5bf7ac45421603d275a528dec856e8f0730ce9b2a08ab357d078fe85a
          AGENT_URL="https://github.com/zeropoint-os/zeropoint-agent/releases/download/v${AGENT_VERSION}/${AGENT_WHEEL}"
          mkdir -p .build/zeropoint-agent
          curl --fail --location --retry 3 --output ".build/zeropoint-agent/${AGENT_WHEEL}" "$AGENT_URL"
          echo "${AGENT_SHA256}  .build/zeropoint-agent/${AGENT_WHEEL}" | sha256sum --check
          printf 'version=%s\nurl=%s\nsha256=%s\n' "$AGENT_VERSION" "$AGENT_URL" "$AGENT_SHA256" > .build/zeropoint-agent/RELEASE.txt

      - name: Generate unit files
        run: python3 generate-unit-files.py

      - name: Test AMD64 image
        uses: aniongithub/pimod@0.31
        with:
          pifile: images/Amd64-Debian.Pifile
          resolv: host
